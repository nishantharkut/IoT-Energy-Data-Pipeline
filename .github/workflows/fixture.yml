name: manual-fixture-acceptance
on:
  workflow_dispatch:

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev,dataset]'
      - run: docker compose config --quiet
      - run: docker compose build spark-client hadoop
      - run: >-
          python -m pytest
          tests/integration/test_fixture_acceptance.py
          tests/integration/test_hadoop_streaming.py -q
