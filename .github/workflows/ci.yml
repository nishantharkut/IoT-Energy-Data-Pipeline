name: coursework-ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src jobs dashboard tests scripts
      - run: ruff format --check src jobs dashboard tests scripts
      - run: python -m pytest tests/unit tests/property tests/contract -q
