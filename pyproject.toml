[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-energy-data-pipeline"
version = "0.1.0"
description = "IoT Energy Data Pipeline - ABV-IIITM IoTBDM coursework using public HKUST smart-meter data"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.1.0,<0.11.0",
    "mypy>=1.10.0,<2.0.0",
    "hypothesis>=6.0.0,<7.0.0",
]
dataset = [
    "pyarrow>=14.0.0,<18.0.0",
    "openpyxl>=3.0.0,<4.0.0",
    "rdflib>=7.0.0,<8.0.0",
]
kafka = [
    "confluent-kafka>=2.2.0,<3.0.0",
]
spark = [
    "pyspark>=3.5.0,<4.0.0",
]
dashboard = [
    "streamlit>=1.36.0,<2.0.0",
    "plotly>=5.22.0,<6.0.0",
]

[project.scripts]
scan-independence = "scripts.scan_independence:main"

[tool.setuptools]
packages = ["iot_energy_pipeline", "scripts"]

[tool.setuptools.package-dir]
"iot_energy_pipeline" = "src/iot_energy_pipeline"
"scripts" = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: unit tests",
    "contract: contract tests",
    "smoke: smoke tests",
    "integration: integration tests",
]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "I"]
ignore = []
isort.known-first-party = ["iot_energy_pipeline", "scripts"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
